# Despliegue de producción (Tarea 13) — IaaS en un VPS.
# Levanta 3 servicios: base de datos, aplicación y proxy inverso.
# Las variables se leen del archivo .env situado junto a este compose.
# Uso:  docker compose -f docker-compose-prod.yml up --build -d

services:
  # --- Base de datos PostgreSQL ---
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Aplicación de la tienda (Express) ---
  tienda-prado:
    build: .
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      SECRET_KEY: ${SECRET_KEY}
      # El host de la BD es "db" (el nombre del servicio de compose)
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
    # Aplica migraciones y carga datos antes de arrancar el servidor
    command: sh -c "npx prisma migrate deploy && node seed.ts && node index.ts"

  # --- Proxy inverso / servidor web (Caddy) ---
  caddy:
    image: caddy:alpine
    depends_on:
      - tienda-prado
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-config:/config
      - caddy-data:/data
      - ./Caddyfile:/etc/caddy/Caddyfile:ro

volumes:
  postgres_data:
  caddy-config:
  caddy-data:
